name: FREE - Franco Content Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free_franco.yml"
  schedule:
    - cron: "12 */2 * * *"
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: free-franco-agent
  cancel-in-progress: false

jobs:
  franco:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout private Franco agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/franco-content-agent
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: agent
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Franco content agent on 2-hour slots
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '12 ')
        working-directory: agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FRANCO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1EtAqlsDVZuHem4_yZebOG3bs9_ESGjSbbU08MQAKUnY
          GEMINI_API_KEY: ${{ secrets.FRANCO_GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.FRANCO_PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.FRANCO_PIXABAY_API_KEY }}
          FRANCO_MEDIA_GITHUB_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.FRANCO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: 8479865303
        run: python main.py

      - name: Run Buffer publisher hourly
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '47 ')
        working-directory: agent
        env:
          BUFFER_API_KEY: ${{ secrets.FRANCO_BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: 6ab3d6a9ea19ca0bdec56971
          BUFFER_ORGANIZATION_ID: 6ab3d645f846d3ce57c78f43
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FRANCO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1EtAqlsDVZuHem4_yZebOG3bs9_ESGjSbbU08MQAKUnY
        run: python buffer_publisher.py
