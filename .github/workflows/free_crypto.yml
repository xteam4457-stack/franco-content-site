name: FREE - Crypto Deriv Shadow Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free_crypto.yml"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "5 18 * * *"

permissions:
  contents: read

concurrency:
  group: free-crypto-shadow-agent
  cancel-in-progress: false

jobs:
  crypto-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private Crypto Agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/crypto-paper-agent
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: agent
          ref: main

      - name: Restore Deriv research state
        uses: actions/cache@v4
        with:
          path: |
            agent/deriv_public_shadow.csv
            agent/deriv_public_status.json
            agent/deriv_demo_status.json
            agent/deriv_demo_trades.csv
            agent/deriv_scanner_ab.csv
            agent/multi_exchange_scanner.json
            agent/deriv_intelligence_log.csv
          key: free-deriv-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            free-deriv-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Validate Crypto Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "CRYPTO_TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "CRYPTO_TELEGRAM_CHAT_ID is missing"; exit 1; }

      - name: Silent runner health-check
        run: echo "Crypto Agent runner OK"

      - name: Run Deriv public shadow research
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/5 * * * *'
        working-directory: agent
        env:
          DERIV_SHADOW_EXPIRY_SECONDS: "60"
          DERIV_SHADOW_MODEL: "momentum_12"
        run: |
          for symbol in R_10 R_25 R_50 R_75 R_100; do
            echo "=== Deriv Shadow $symbol ==="
            DERIV_SHADOW_SYMBOL="$symbol" python deriv_public_shadow.py
          done

      - name: Run Deriv Demo multi-market validation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/5 * * * *'
        working-directory: agent
        env:
          DERIV_PAT: ${{ secrets.CRYPTO_DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.CRYPTO_DERIV_APP_ID }}
          DERIV_DEMO_EXPIRY_SECONDS: "60"
          DERIV_DEMO_MODEL: "momentum_12"
          DERIV_DEMO_STAKE: "1"
          DERIV_DEMO_MIN_PROFIT_FRACTION: "0.86"
          DERIV_DEMO_AUTO_TRADE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$DERIV_PAT" ] && [ -n "$DERIV_APP_ID" ]; then
            echo "Mode: DERIV DEMO MULTI-MARKET"
            for symbol in R_10 R_25 R_50 R_75 R_100; do
              echo "=== Deriv Demo $symbol ==="
              DERIV_DEMO_SYMBOL="$symbol" python deriv_demo_agent.py
            done
          else
            echo "Deriv Demo credentials are not configured yet; Shadow only."
          fi

      - name: Send daily report
        if: github.event.schedule == '5 18 * * *'
        working-directory: agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
          STRATEGY_EQUITY_CAP: "50"
        run: python deriv_daily_report.py

# verify-deriv-demo
