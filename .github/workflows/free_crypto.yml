name: FREE - Crypto Deriv Shadow Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free_crypto.yml"
  schedule:
    - cron: "*/10 * * * *"
    - cron: "5 18 * * *"

permissions:
  contents: read

concurrency:
  group: free-crypto-shadow-agent
  cancel-in-progress: false

jobs:
  crypto-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private Crypto Agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/crypto-paper-agent
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: agent
          ref: main

      - name: Restore Deriv research state
        uses: actions/cache@v4
        with:
          path: |
            agent/deriv_public_shadow.csv
            agent/deriv_public_status.json
            agent/deriv_demo_status.json
            agent/deriv_demo_trades.csv
          key: free-deriv-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            free-deriv-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Validate Crypto Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "CRYPTO_TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "CRYPTO_TELEGRAM_CHAT_ID is missing"; exit 1; }

      - name: Telegram health-check
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          chat=os.environ["TELEGRAM_CHAT_ID"]
          r=requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={"chat_id":chat,"text":"Crypto Agent runner OK ✅"}, timeout=20)
          print(r.status_code, r.text)
          r.raise_for_status()
          PY

      - name: Run Deriv public shadow research
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/10 * * * *'
        working-directory: agent
        env:
          DERIV_SHADOW_SYMBOL: "R_10"
          DERIV_SHADOW_EXPIRY_SECONDS: "60"
          DERIV_SHADOW_MODEL: "momentum_12"
        run: python deriv_public_shadow.py

      - name: Run Deriv Demo when credentials are configured
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/10 * * * *'
        working-directory: agent
        env:
          DERIV_PAT: ${{ secrets.CRYPTO_DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.CRYPTO_DERIV_APP_ID }}
          DERIV_DEMO_SYMBOL: "R_10"
          DERIV_DEMO_EXPIRY_SECONDS: "60"
          DERIV_DEMO_MODEL: "momentum_12"
          DERIV_DEMO_STAKE: "1"
          DERIV_DEMO_MIN_PROFIT_FRACTION: "0.90"
          DERIV_DEMO_AUTO_TRADE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$DERIV_PAT" ] && [ -n "$DERIV_APP_ID" ]; then
            echo "Mode: DERIV DEMO"
            python deriv_demo_agent.py
          else
            echo "Deriv Demo credentials are not configured yet; Shadow only."
          fi

      - name: Send daily report
        if: github.event.schedule == '5 18 * * *'
        working-directory: agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
          STRATEGY_EQUITY_CAP: "50"
        run: python deriv_daily_report.py

# verify-deriv-demo
