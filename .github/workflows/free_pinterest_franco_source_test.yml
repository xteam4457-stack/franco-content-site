name: FREE - Pinterest Franco Source Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free_pinterest_franco_source_test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private Franco agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/franco-content-agent
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: agent
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Dry-run Pinterest source
        working-directory: agent
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_API_BASE: "https://api.pinterest.com/v5"
        run: python pinterest_franco_source_test.py
