name: TEST - Franco System Healthcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/franco_system_healthcheck.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private Franco code
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/franco-content-agent
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
          path: agent
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Compile all Franco scripts
        working-directory: agent
        run: |
          python -m py_compile \
            main.py buffer_publisher.py telegram_agent.py \
            telegram_channel_publisher.py telegram_graphics.py \
            reel_agent.py pinterest_test.py pinterest_franco_source_test.py

      - name: Run regression healthcheck, without external posting
        working-directory: agent
        run: python franco_healthcheck.py

