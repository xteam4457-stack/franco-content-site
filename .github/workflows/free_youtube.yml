name: FREE - YouTube AI Agent (full episode)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free_youtube.yml'

permissions:
  contents: read

concurrency:
  group: free-youtube-agent
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Test Russian-language notifications from private YouTube Agent.
      - name: Checkout separate private YouTube Agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/youtube-ai-agent
          token: ${{ secrets.YOUTUBE_PRIVATE_REPO_TOKEN }}
          ref: main
          path: agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: agent
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure YouTube-only Telegram configuration exists
        env:
          YOUTUBE_TELEGRAM_BOT_TOKEN: ${{ secrets.YOUTUBE_TELEGRAM_BOT_TOKEN }}
          YOUTUBE_TELEGRAM_CHAT_ID: ${{ secrets.YOUTUBE_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$YOUTUBE_TELEGRAM_BOT_TOKEN"
          test -n "$YOUTUBE_TELEGRAM_CHAT_ID"

      - name: Run long-form script quality checks
        working-directory: agent
        run: python -m unittest test_main.py test_longform.py

      - name: Collect Wikimedia still-image candidates for review
        working-directory: agent
        continue-on-error: true
        run: python collect_commons_images.py --limit 84 --out-dir output/wikimedia

      - name: Create documentary photo contact sheet
        working-directory: agent
        run: |
          python -m pip install Pillow
          python make_contact_sheet.py --images output/wikimedia --out output/review_frames/asset_contact_sheet.jpg
          python audit_visuals.py --manifest output/wikimedia/candidate_assets.json --out output/review_frames/visual_audit.json

      - name: Preserve research candidates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-episode-001-commons-candidates
          path: |
            agent/output/wikimedia/
            agent/output/review_frames/asset_contact_sheet.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: Generate natural English narration (Kokoro)
        working-directory: agent
        timeout-minutes: 9
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install "kokoro>=0.9.4,<1" soundfile
          mkdir -p output/voice_sample
          python narration_kokoro.py --script episodes/001_mcdonalds/script_en.txt --out output/voice_sample/voice_raw.wav --voice am_michael
          RAW=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/voice_sample/voice_raw.wav)
          echo "Raw Kokoro narration: $RAW seconds"
          FACTOR=$(python -c 'import sys; x=float(sys.argv[1]); print(max(0.85,min(1.15,x/615)))' "$RAW")
          ffmpeg -hide_banner -loglevel error -y -i output/voice_sample/voice_raw.wav -af "atempo=$FACTOR" output/voice_sample/voice.wav
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/voice_sample/voice.wav)
          echo "Kokoro narration duration: $DURATION sec"
          python -c 'import sys; n=float(sys.argv[1]); assert 600<=n<=900, f"Invalid voice duration: {n}"' "$DURATION"

      - name: Preserve full narration for listening
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-episode-001-full-narration
          path: agent/output/voice_sample/
          if-no-files-found: warn
          retention-days: 7

      - name: Render full episode for final review
        working-directory: agent
        timeout-minutes: 12
        run: |
          python render_roughcut.py \
            --images output/wikimedia \
            --audio output/voice_sample/voice.wav \
            --out output/final/episode001_mcdonalds.mp4

      - name: Verify full episode technical quality
        working-directory: agent
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          video=pathlib.Path("output/final/episode001_mcdonalds.mp4")
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(video)]))
          duration=float(data["format"]["duration"])
          streams=data["streams"]
          v=next(x for x in streams if x["codec_type"]=="video")
          assert 600<=duration<=900, f"Invalid duration: {duration}"
          assert (v["width"],v["height"])==(1920,1080), "Invalid resolution"
          assert any(x["codec_type"]=="audio" for x in streams), "No audio"
          folder=pathlib.Path("output/review_frames")
          folder.mkdir(parents=True,exist_ok=True)
          for i in range(12):
              t=(i+.5)*duration/12
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-ss",str(t),"-i",str(video),"-frames:v","1","-vf","scale=640:360",str(folder/f"scene_{i+1:02d}.jpg")],check=True)
          print(f"TECHNICAL PASS {duration:.1f}s 1920x1080 with audio; editorial review is still required")
          PY

      - name: Save representative frames for image review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-episode-001-review-frames
          path: agent/output/review_frames/
          if-no-files-found: warn
          retention-days: 7

      - name: Save full episode MP4 for approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-episode-001-FULL-MP4-REVIEW
          path: agent/output/final/
          if-no-files-found: warn
          retention-days: 14

      - name: Send completed video to YouTube Telegram bot for review
        if: success()
        working-directory: agent
        env:
          YOUTUBE_TELEGRAM_BOT_TOKEN: ${{ secrets.YOUTUBE_TELEGRAM_BOT_TOKEN }}
          YOUTUBE_TELEGRAM_CHAT_ID: ${{ secrets.YOUTUBE_TELEGRAM_CHAT_ID }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, urllib.parse, json
          video=pathlib.Path("output/final/episode001_mcdonalds.mp4")
          token=os.environ["YOUTUBE_TELEGRAM_BOT_TOKEN"]
          chat=os.environ["YOUTUBE_TELEGRAM_CHAT_ID"]
          base=f"https://api.telegram.org/bot{token}"
          def message(text):
              data=urllib.parse.urlencode({"chat_id":chat,"text":text}).encode()
              with urllib.request.urlopen(urllib.request.Request(base+"/sendMessage",data=data),timeout=30) as r:
                  answer=json.load(r)
              if not answer.get("ok"):raise RuntimeError("Telegram message failed")
          size=video.stat().st_size
          caption="McDonald's — полный ролик на проверку (не опубликован на YouTube)."
          # Telegram cloud Bot API sendVideo / sendDocument upload limits can vary.
          # Keep an accessible GitHub Actions artifact fallback.
          if size>49_000_000:
              message(f"Готов MP4 McDonald's ({size/1048576:.1f} МБ), но он слишком большой для безопасной отправки ботом. Скачай его из GitHub Actions → Artifacts: {os.environ['ACTIONS_RUN_URL']}")
          else:
              boundary="----YTDocUploadBoundary"
              fields={"chat_id":chat,"caption":caption,"supports_streaming":"true"}
              parts=[]
              for key,value in fields.items():
                  parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{key}\"\r\n\r\n{value}\r\n".encode())
              parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"video\"; filename=\"{video.name}\"\r\nContent-Type: video/mp4\r\n\r\n".encode())
              parts.append(video.read_bytes())
              parts.append(f"\r\n--{boundary}--\r\n".encode())
              data=b"".join(parts)
              req=urllib.request.Request(base+"/sendVideo",data=data,headers={"Content-Type":f"multipart/form-data; boundary={boundary}"})
              try:
                  with urllib.request.urlopen(req,timeout=180) as r: result=json.load(r)
                  if not result.get("ok"):raise RuntimeError("Telegram video upload rejected")
                  print("Video sent to YouTube Telegram bot")
              except Exception as e:
                  print("Telegram video upload unavailable:",type(e).__name__)
                  message(f"MP4 McDonald's собран, но отправить видео файлом не получилось. Скачать: {os.environ['ACTIONS_RUN_URL']} → Artifacts → youtube-episode-001-FULL-MP4-REVIEW")
          PY

      # Editorial rights and scene relevance remain subject to approval.
      # Never publish to YouTube automatically.

# Manual pilot only. No cron, no access to Franco/crypto/money secrets.
# Create the private youtube-ai-agent repo and YOUTUBE_* secrets before enabling this workflow.
