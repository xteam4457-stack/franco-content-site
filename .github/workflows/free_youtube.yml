name: FREE - YouTube AI Agent (manual pilot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free_youtube.yml'

permissions:
  contents: read

concurrency:
  group: free-youtube-agent
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Test Russian-language notifications from private YouTube Agent.
      - name: Checkout separate private YouTube Agent
        uses: actions/checkout@v4
        with:
          repository: xteam4457-stack/youtube-ai-agent
          token: ${{ secrets.YOUTUBE_PRIVATE_REPO_TOKEN }}
          ref: main
          path: agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: agent
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure YouTube-only Telegram configuration exists
        env:
          YOUTUBE_TELEGRAM_BOT_TOKEN: ${{ secrets.YOUTUBE_TELEGRAM_BOT_TOKEN }}
          YOUTUBE_TELEGRAM_CHAT_ID: ${{ secrets.YOUTUBE_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$YOUTUBE_TELEGRAM_BOT_TOKEN"
          test -n "$YOUTUBE_TELEGRAM_CHAT_ID"

      - name: Run long-form script quality checks
        working-directory: agent
        run: python -m unittest test_main.py test_longform.py

      - name: Collect Wikimedia still-image candidates for review
        working-directory: agent
        continue-on-error: true
        run: python collect_commons_images.py --limit 84 --out-dir output/wikimedia

      - name: Preserve research candidates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-episode-001-commons-candidates
          path: agent/output/wikimedia/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate full English documentary narration
        working-directory: agent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "piper-tts==1.3.0"
          mkdir -p output/voice_models output/voice_sample
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
          curl -fL --retry 2 "$BASE/en_US-lessac-medium.onnx" -o output/voice_models/en_US-lessac-medium.onnx
          curl -fL --retry 2 "$BASE/en_US-lessac-medium.onnx.json" -o output/voice_models/en_US-lessac-medium.onnx.json
          cp episodes/001_mcdonalds/script_en.txt output/voice_sample/sample_script.txt
          python -m piper -m output/voice_models/en_US-lessac-medium.onnx -f output/voice_sample/voice.wav < output/voice_sample/sample_script.txt
          ffmpeg -hide_banner -loglevel error -y -i output/voice_sample/voice.wav -af "atempo=0.96" output/voice_sample/voice_adjusted.wav
          mv output/voice_sample/voice_adjusted.wav output/voice_sample/voice.wav
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/voice_sample/voice.wav)
          echo "Generated narration duration: $DURATION sec"
          python -c 'import sys; n=float(sys.argv[1]); print("Duration OK" if 600<=n<=900 else "Duration outside 10-15 min"); sys.exit(0 if 600<=n<=900 else 1)' "$DURATION"

      - name: Preserve full narration for listening
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-episode-001-full-narration
          path: agent/output/voice_sample/
          if-no-files-found: warn
          retention-days: 7

      - name: Render private 10-minute editorial rough cut
        working-directory: agent
        timeout-minutes: 12
        run: |
          python render_roughcut.py \
            --images output/wikimedia \
            --audio output/voice_sample/voice.wav \
            --out output/roughcut/episode001_review_only.mp4

      - name: Verify rough cut and extract review frames
        working-directory: agent
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          video=pathlib.Path("output/roughcut/episode001_review_only.mp4")
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(video)]))
          duration=float(data["format"]["duration"])
          streams=data["streams"]
          v=next(x for x in streams if x["codec_type"]=="video")
          assert 600<=duration<=900, f"Invalid duration: {duration}"
          assert (v["width"],v["height"])==(1920,1080), "Invalid resolution"
          assert any(x["codec_type"]=="audio" for x in streams), "No audio"
          folder=pathlib.Path("output/review_frames")
          folder.mkdir(parents=True,exist_ok=True)
          for i in range(12):
              t=(i+.5)*duration/12
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-ss",str(t),"-i",str(video),"-frames:v","1","-vf","scale=640:360",str(folder/f"scene_{i+1:02d}.jpg")],check=True)
          print(f"TECHNICAL PASS {duration:.1f}s 1920x1080 with audio; editorial review is still required")
          PY

      - name: Save representative frames for image review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-episode-001-review-frames
          path: agent/output/review_frames/
          if-no-files-found: warn
          retention-days: 7

      - name: Save private rough cut (not approved for publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-episode-001-ROUGH-CUT-UNREVIEWED
          path: agent/output/roughcut/
          if-no-files-found: warn
          retention-days: 3

      # Deliberately do not send the old 20-second video or auto-publish.

# Manual pilot only. No cron, no access to Franco/crypto/money secrets.
# Create the private youtube-ai-agent repo and YOUTUBE_* secrets before enabling this workflow.
