name: Resend Franco Pending Review

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resend_franco_pending.yml"

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Resend Franco candidate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FRANCO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.FRANCO_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || exit 1
          test -n "$TELEGRAM_CHAT_ID" || exit 1
          REPLY_MARKUP='{"inline_keyboard":[[{"text":"✅ Одобрить","callback_data":"fv_ok:PIXABAY-485901"},{"text":"❌ Отклонить","callback_data":"fv_no:PIXABAY-485901"}]]}'
          CAPTION='📸 Franco Content — повторная проверка | 06.10.2026 08:30 | Dubai | STORY Fitness | ID: PIXABAY-485901 | Mentalidad clara, cuerpo activo.'
          curl --fail --show-error --silent -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "photo=https://raw.githubusercontent.com/xteam4457-stack/franco-content-site/main/media/franco/pixabay_485901.jpg" -F "caption=${CAPTION}" -F "reply_markup=${REPLY_MARKUP}"
          echo
          echo "Telegram resend completed."
